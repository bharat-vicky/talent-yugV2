services:
  gateway:
    build:
      context: .
      target: gateway
    expose:
      - "80"
    depends_on:
      pahchaan:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  pahchaan:
    build:
      context: .
      target: pahchaan
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the public URL ending in /pahchaan}
    environment:
      # Coolify evaluates this file for both build and startup. Runtime secrets
      # must not make the build require them as Docker build arguments.
      MONGODB_URI: ${MONGODB_URI:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_URL_INTERNAL: http://pahchaan:3000/pahchaan/api/auth
      AUTH_SECRET: ${AUTH_SECRET:-}
      JOB_WORKER_SECRET: ${JOB_WORKER_SECRET:-}
      JOB_ENCRYPTION_KEY: ${JOB_ENCRYPTION_KEY:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TRUST_PROXY: "false"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/pahchaan/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    environment:
      JOB_WORKER_SECRET: ${JOB_WORKER_SECRET}
      JOB_WORKER_URL: http://pahchaan:3000/pahchaan/api/internal/jobs
    depends_on:
      pahchaan:
        condition: service_healthy
    restart: unless-stopped
