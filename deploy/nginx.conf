map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}

# Authentication cookies and OAuth callbacks must use one canonical host.
server {
    listen 80;
    server_name www.talentyug.in;
    return 308 https://talentyug.in$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Only the internal worker may invoke the job runner.
    location = /pahchaan/api/internal/jobs { return 404; }
    location ^~ /pahchaan/api/debug { return 404; }

    # Preserve uploaded-file URLs already stored before the subpath migration.
    location ^~ /api/files/ {
        return 307 /pahchaan$request_uri;
    }

    location ~ ^/pahchaan(?:/|$) {
        proxy_pass http://pahchaan:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
