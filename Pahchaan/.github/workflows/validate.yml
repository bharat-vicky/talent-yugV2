name: Validate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-isolated-authentication-secret-never-for-production
      NEXTAUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/identity_test_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:readiness
      - name: Start isolated build database
        run: |
          docker run -d --name identity-ci -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec identity-ci mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec identity-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec identity-ci mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: docs/test-results/
